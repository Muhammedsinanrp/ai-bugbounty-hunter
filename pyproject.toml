[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-bugbounty-hunter"
version = "1.0.0"
description = "AI-Powered Bug Bounty Automation Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammedsinanrp", email = "" }]
keywords = ["bugbounty", "security", "penetration-testing", "ai", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "rich>=13.0",
    "colorama>=0.4",
    "tqdm>=4.66",
    "ujson>=5.9",
    "python-telegram-bot>=21.0",
]

[project.scripts]
bugbounty    = "bugbounty_hunter.main:main_cli"
bugbot       = "bugbounty_hunter.main:main_bot"

[tool.setuptools.packages.find]
where = ["."]
include = ["bugbounty_hunter*", "core*", "recon*", "scanners*", "ai_engine*", "utils*"]
